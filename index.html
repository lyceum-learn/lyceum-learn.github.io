<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Обучение «Лицей»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root {
  --bg: #FFFFFF; --surface-2: #F6F5F3; --ink: #1A1A1A; --muted: #707070; --line: #ECEAE6;
  --accent: #ED272E; --accent-dark: #C81E25; --accent-soft: #FDEBEC; --ok: #1F8A4C; --ok-soft: #E6F4EC; --warn: #B76E00; --warn-soft: #FFF3DC;
  --gold: #E9A400; --r: 16px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
  --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Manrope', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: default; opacity: .45; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 640px; margin: 0 auto; padding-bottom: calc(76px + var(--safe-b)); }
.view { padding: 0 16px 24px; }
.view.anim { animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* шапка главной */
.hero { background: var(--accent); color: #fff; margin: 0 -16px 18px; padding: 18px 18px 22px; border-radius: 0 0 26px 26px; position: relative; overflow: hidden; }
.hero .logo { width: 92px; height: auto; color: #fff; display: block; }
.hero .top { display: flex; justify-content: space-between; align-items: center; }
.hero .me { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.16); border-radius: 99px; padding: 5px 12px 5px 5px; font-size: 13px; font-weight: 600; color: #fff; }
.hero .ava { width: 26px; height: 26px; border-radius: 50%; background: #fff; color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.hero h1 { font: 600 30px/1.1 var(--serif); margin: 18px 0 2px; }
.hero .sub { opacity: .85; font-size: 13px; }
.hero .stats { display: flex; gap: 10px; margin-top: 16px; }
.hero .stat { flex: 1; background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 12px; }
.hero .stat b { display: block; font-size: 22px; line-height: 1.1; }
.hero .stat span { font-size: 12px; opacity: .85; }
.hero .bar { height: 6px; border-radius: 9px; background: rgba(255,255,255,.25); margin-top: 8px; overflow: hidden; }
.hero .bar i { display: block; height: 100%; background: #fff; border-radius: 9px; }
.hero .ornament { position: absolute; right: -60px; top: -50px; width: 200px; opacity: .12; color: #fff; pointer-events: none; }

/* заголовки */
.head { display: flex; align-items: center; gap: 10px; padding: 16px 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.head h2 { font: 600 26px/1.1 var(--serif); margin: 0; flex: 1; }
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }

/* списки и карточки */
.list { display: grid; gap: 10px; }
.row { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.row .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 19px; flex: none; }
.row .tx { flex: 1; min-width: 0; }
.row .tt { font-weight: 600; }
.row .mt { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row .chev { color: #C9C6C0; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.red { background: var(--accent-soft); color: var(--accent-dark); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.gold { background: #FFF6DB; color: #8A6100; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 14px; }
.pbar { height: 5px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 7px; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }

/* меню */
.search { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 14px; outline: none; font-size: 16px; }
.search:focus { border-color: var(--accent); background: #fff; }
select.search { appearance: none; -webkit-appearance: none; color: var(--ink); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; background: #fff; }
.fchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.fchip.no.on { background: var(--accent); border-color: var(--accent); }
.flabel { font-size: 12px; color: var(--muted); margin-top: 10px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.card { text-align: left; border-radius: var(--r); overflow: hidden; background: #fff; box-shadow: var(--shadow); border: 1px solid var(--line); display: flex; flex-direction: column; }
.ph { width: 100%; aspect-ratio: 4/3; background: var(--surface-2); display: grid; place-items: center; position: relative; overflow: hidden; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .ini { font: 600 40px var(--serif); color: var(--accent); opacity: .55; }
.ph .badge { position: absolute; top: 8px; left: 8px; }
.card .cb { padding: 9px 11px 11px; }
.card .ct { font-weight: 700; font-size: 14px; line-height: 1.3; }
.al { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.al span { font-size: 11px; font-weight: 600; color: var(--accent-dark); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; }

/* детали */
.big-ph { margin: 0 -16px 14px; aspect-ratio: 4/3; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; }
.big-ph img { width: 100%; height: 100%; object-fit: cover; }
.big-ph .ini { font: 600 80px var(--serif); color: var(--accent); opacity: .4; }
.lead { color: var(--muted); margin: 4px 0 12px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prose { font-size: 15px; line-height: 1.6; }
.prose h2, .prose h3 { font: 600 22px/1.2 var(--serif); margin: 20px 0 8px; }
.prose h4, .prose h5 { font-size: 16px; margin: 16px 0 6px; }
.prose p { margin: 0 0 10px; }
.prose ul, .prose ol { padding-left: 20px; margin: 0 0 12px; }
.prose li { margin: 4px 0; }
.prose img { max-width: 100%; border-radius: 12px; display: block; margin: 8px 0; }
.prose blockquote { margin: 12px 0; padding: 10px 14px; background: var(--warn-soft); border-radius: 12px; color: #5C3E00; }
.prose .tbl { overflow-x: auto; margin: 8px 0 14px; }
.prose table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 700; }
.prose a[data-ref] { font-weight: 600; text-decoration: underline; cursor: pointer; }
.prose code { background: var(--surface-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.prose li.check { list-style: none; margin-left: -20px; display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; user-select: none; }
.prose li.check .box { width: 22px; height: 22px; border: 2px solid #CFCBC4; border-radius: 7px; flex: none; display: grid; place-items: center; margin-top: 1px; }
.prose li.check.on { background: var(--ok-soft); border-color: transparent; }
.prose li.check.on .box { background: var(--ok); border-color: var(--ok); }
.prose li.check.on .box::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }

/* кнопки */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border-radius: 14px; padding: 14px; font-weight: 700; background: var(--accent); color: #fff; }
.btn:active { background: var(--accent-dark); }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.okb { background: var(--ok); }
.btns { display: flex; gap: 10px; margin-top: 18px; }
.sticky-act { position: sticky; bottom: calc(76px + var(--safe-b)); padding: 12px 0 4px; background: linear-gradient(transparent, #fff 30%); }

/* тест */
.qprog { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.qprog .pbar { flex: 1; margin: 0; }
.qtext { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 18px 0 6px; }
.qhint { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.qimg { width: 100%; border-radius: 14px; margin: 6px 0 12px; }
.opt { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 9px; background: #fff; }
.opt .mk { width: 22px; height: 22px; border: 2px solid #CFCBC4; border-radius: 50%; flex: none; display: grid; place-items: center; }
.opt.multi .mk { border-radius: 7px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt.on .mk { border-color: var(--accent); background: var(--accent); }
.opt.on .mk::after { content: ''; width: 8px; height: 8px; background: #fff; border-radius: 50%; }
.opt.multi.on .mk::after { width: 5px; height: 10px; background: none; border: solid #fff; border-width: 0 2.5px 2.5px 0; border-radius: 0; transform: rotate(45deg) translate(-1px, -1px); }
.result { text-align: center; padding: 26px 0 10px; }
.result .pct { font: 600 72px/1 var(--serif); }
.result .pct.ok { color: var(--ok); }
.result .pct.bad { color: var(--accent); }
.result .verdict { font-weight: 700; font-size: 18px; margin-top: 8px; }
.result .earned { display: inline-flex; gap: 6px; margin-top: 14px; background: #FFF6DB; color: #8A6100; padding: 8px 16px; border-radius: 99px; font-weight: 800; animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.rv { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 9px; }
.rv.bad { border-color: #F5C2C4; background: #FFF8F8; }
.rv .q { font-weight: 600; }
.rv .a { font-size: 14px; margin-top: 6px; }
.rv .a b { font-weight: 700; }
.rv .x { font-size: 13px; color: var(--muted); margin-top: 6px; }

/* тренировка карточек */
.flash { border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; margin-top: 6px; }
.flash .ph { aspect-ratio: 16/10; }
.flash .fb { padding: 16px; }
.flash h3 { font: 600 26px/1.15 var(--serif); margin: 0 0 4px; }

/* призы */
.wallet { display: flex; align-items: center; justify-content: space-between; background: #FFF6DB; border-radius: var(--r); padding: 16px 18px; }
.wallet b { font-size: 30px; color: #8A6100; }
.prize { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; background: #fff; }
.prize .ph { aspect-ratio: 1; font-size: 44px; }
.prize .pb { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.prize .pt { font-weight: 700; font-size: 14px; line-height: 1.3; }
.prize .pd { font-size: 12px; color: var(--muted); flex: 1; }
.prize .btn { padding: 9px; font-size: 14px; border-radius: 11px; }

/* ранги */
.ladder { display: grid; gap: 6px; }
.rung { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.rung.cur { background: var(--accent); color: #fff; font-weight: 700; }
.rung.done { color: var(--muted); }

/* нижнее меню */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: var(--safe-b); z-index: 20; }
.tabs[hidden] { display: none; }
.tabs nav { display: flex; width: 100%; max-width: 640px; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 0 8px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 23px; height: 23px; }
.tabs button.on { color: var(--accent); }

/* служебное */
.center { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 14px; }
.center .logo { width: 140px; color: var(--accent); }
.center h2 { font: 600 28px/1.15 var(--serif); margin: 6px 0 0; }
.center p { color: var(--muted); margin: 0; max-width: 320px; }
.spin { width: 28px; height: 28px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; z-index: 50; max-width: 90vw; animation: fade .2s; }
.toast.gold { background: #8A6100; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; z-index: 60; }
.modal .sheet { background: #fff; width: 100%; max-width: 640px; border-radius: 22px 22px 0 0; padding: 22px 18px calc(18px + var(--safe-b)); animation: up .2s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { font: 600 24px var(--serif); margin: 0 0 6px; }
.sync { position: fixed; top: 8px; right: 8px; font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 3px 9px; z-index: 30; }
</style>
</head>

<script>
'use strict';
const TG = window.Telegram && Telegram.WebApp;
const DEV = (() => { try { return window.parent !== window && window.parent.LEARN_DEV; } catch (e) { return null; } })();
const API = window.LEARN_API || '';
const $app = document.getElementById('app');
const logo = () => document.getElementById('logo').innerHTML;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };

let B = null;          // данные пользователя из таблицы
let C = { cards: [], materials: [], programs: [] }; // материалы с GitHub
let stack = [];        // история экранов
let tab = 'home';
let menuF = { q: '', cat: '', no: [], repeat: false };
const initData = DEV ? DEV.initData : (TG && TG.initData) || '';
const uid = (() => { try { return JSON.parse(new URLSearchParams(initData).get('user')).id; } catch (e) { return 'x'; } })();
const LS = { boot: 'learn-boot-' + uid, queue: 'learn-q-' + uid, run: 'learn-run-' + uid };
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

// ---------- связь с таблицей ----------
async function api(fn, ...args) {
  if (DEV) return DEV.call(fn, [initData, ...args]);
  if (!API) throw new Error('Не задан адрес сервера (config.js)');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 40000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args: [initData, ...args] }), signal: ctl.signal });
    const j = await r.json();
    if (j.error) { const e = new Error(j.error); e.server = true; throw e; }
    return j.result;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер долго не отвечает — попробуйте ещё раз');
    if (!e.server) throw new Error('Нет связи. Проверьте интернет');
    throw e;
  } finally { clearTimeout(t); }
}

// отметки (знаю/прочитано/чек-лист) — сразу на экране, на сервер очередью: не теряются без связи
let flushing = false;
function queueMark(type, id, status, details) {
  const q = ls.get(LS.queue, []).filter(x => !(x.type === type && x.id === id));
  q.push({ type, id, status, details: details || '' });
  ls.set(LS.queue, q);
  B.progress[type + ':' + id] = { status, details: details || '', at: '' };
  ls.set(LS.boot, B);
  flush();
}
async function flush() {
  if (flushing) return;
  flushing = true;
  try {
    let q = ls.get(LS.queue, []);
    while (q.length) {
      const m = q[0];
      const r = await api('mark', m.type, m.id, m.status, m.details);
      q = ls.get(LS.queue, []).filter(x => !(x.type === m.type && x.id === m.id && x.status === m.status && x.details === m.details));
      ls.set(LS.queue, q);
      if (r && r.balance) { B.stars = r.balance; ls.set(LS.boot, B); }
      if (r && r.stars > 0) { toast('+' + r.stars + ' ⭐', true); haptic('success'); refreshBoot(); }
    }
    syncBadge(false);
  } catch (e) {
    syncBadge(true);
    setTimeout(() => { flushing = false; flush(); }, 15000);
    return;
  }
  flushing = false;
}
function syncBadge(on) {
  let el = document.getElementById('sync');
  if (!on) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'sync'; el.className = 'sync'; document.body.appendChild(el); }
  el.textContent = 'Нет связи — отметки сохранены';
}

// ---------- доступ к материалам по должности и проекту ----------
function fits(x) {
  if (!B || B.me.admin) return true;
  const roles = (x.roles || []).map(norm), places = (x.places || []).map(norm);
  const okR = !roles.length || roles.includes('все') || roles.includes(norm(B.me.role));
  const okP = !places.length || places.includes('все') || places.includes(norm(B.me.object)) || places.includes(norm(B.me.project));
  return okR && okP;
}
const cards = () => C.cards.filter(fits);
const materials = () => C.materials.filter(fits);
const programs = () => C.programs.filter(fits);
const byId = id => C.cards.concat(C.materials, C.programs).find(x => x.id === id);
const prog = (type, id) => (B.progress[type + ':' + id] || {}).status || '';
const checked = id => { const p = B.progress['checklist:' + id]; return p && p.details ? p.details.split(',').filter(String).map(Number) : []; };

function stepDone(p, s) {
  if (s.test) { const t = B.tests.find(x => x.id === s.test); return !!(t && t.stat && t.stat.passed); }
  if (s.ref) {
    const r = byId(s.ref);
    if (r && r.type === 'checklist') return checked(r.id).length >= r.items.length;
    if (r && r.type === 'card') return prog('card', r.id) === 'знаю';
    if (prog('material', s.ref) === 'прочитано') return true;
  }
  return prog('step', p.id + ':' + s.key) === 'выполнено';
}
function progPct(p) {
  const steps = p.days.flatMap(d => d.steps);
  return steps.length ? Math.round(steps.filter(s => stepDone(p, s)).length / steps.length * 100) : 0;
}

// ---------- навигация ----------
function go(view, arg, replace) {
  if (replace) stack.pop();
  stack.push({ view, arg, y: 0 });
  render(true);
}
function back() {
  if (stack.length > 1) { stack.pop(); render(false); }
}
function setTab(t) {
  tab = t;
  stack = [{ view: t, arg: null, y: 0 }];
  render(true);
}
function render(top) {
  const cur = stack[stack.length - 1];
  const fn = VIEWS[cur.view] || VIEWS.home;
  $app.innerHTML = '<div class="view' + (top ? ' anim' : '') + '">' + fn(cur.arg) + '</div>';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  if (TG && TG.BackButton) { if (stack.length > 1) TG.BackButton.show(); else TG.BackButton.hide(); }
  window.scrollTo(0, top ? 0 : cur.y || 0);
  if (AFTER[cur.view]) AFTER[cur.view](cur.arg);
}
window.addEventListener('scroll', () => { const c = stack[stack.length - 1]; if (c) c.y = window.scrollY; }, { passive: true });
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { haptic('light'); setTab(b.dataset.tab); } });
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-act],a[data-ref]');
  if (!el) return;
  if (el.matches('a[data-ref]')) { e.preventDefault(); openItem(el.dataset.ref); return; }
  if (el.dataset.go) { go(el.dataset.go, el.dataset.arg || null); return; }
  ACT[el.dataset.act] && ACT[el.dataset.act](el, e);
});
function openItem(id) {
  const x = byId(id);
  if (!x) { const t = B.tests.find(t => t.id === id); if (t) return go('test', id); toast('Материал не найден'); return; }
  go(x.type === 'card' ? 'card' : x.type === 'program' ? 'program' : 'material', id);
}
const head = (title, noBack) => '<div class="head">' + (noBack || stack.length < 2 ? '' :
  '<button class="back" data-act="back" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>') +
  '<h2>' + esc(title) + '</h2></div>';
const chev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
const initials = s => esc(String(s || '?').replace(/[«»"(]/g, '').trim().charAt(0).toUpperCase());
const photo = (x, cls) => '<div class="' + (cls || 'ph') + '">' + (x.photo ? '<img src="' + esc(x.photo) + '" alt="" loading="lazy">' : '<span class="ini">' + initials(x.title) + '</span>') + '</div>';

// ---------- экраны ----------
const VIEWS = {}, AFTER = {}, ACT = {};
ACT.back = back;

VIEWS.home = () => {
  const r = B.rank, st = B.stars;
  const nextPct = r.next ? Math.min(100, Math.round((st.earned - r.from) / Math.max(1, r.next.from - r.from) * 100)) : 100;
  const first = String(B.me.name).split(/\s+/)[1] || B.me.name;
  let h = '<div class="hero">' + '<div class="ornament">' + logo() + '</div>' +
    '<div class="top">' + logo() + '<button class="me" data-go="profile"><span class="ava">' + initials(first) + '</span>Профиль</button></div>' +
    '<h1>Привет, ' + esc(first) + '!</h1><div class="sub">' + esc(B.me.role) + ' · ' + esc(B.me.object) + '</div>' +
    '<div class="stats"><div class="stat"><b>' + st.balance + ' ⭐</b><span>можно потратить</span></div>' +
    '<div class="stat"><b>' + esc(r.name) + '</b><span>' + (r.next ? 'ещё ' + (r.next.from - st.earned) + ' ⭐ до «' + esc(r.next.name) + '»' : 'высший ранг') + '</span><div class="bar"><i style="width:' + nextPct + '%"></i></div></div></div></div>';

  const asg = B.assignments.map(a => {
    if (a.kind === 'test') {
      const t = B.tests.find(x => x.id === a.id);
      const done = t && t.stat && t.stat.passed;
      return { done, html: row('📝', a.title, deadlineText(a.deadline, done) + (a.comment ? ' · ' + esc(a.comment) : ''), 'test', a.id, done ? '<span class="chip ok">Сдан</span>' : dlChip(a.deadline)) };
    }
    const p = C.programs.find(x => x.id === a.id);
    const pct = p ? progPct(p) : 0;
    return { done: pct === 100, html: row('🧭', a.title, pct + '% · ' + deadlineText(a.deadline, pct === 100), 'program', a.id, pct === 100 ? '<span class="chip ok">Готово</span>' : dlChip(a.deadline)) };
  });
  const todo = asg.filter(a => !a.done);
  if (asg.length) h += '<div class="sec">Назначено вам</div><div class="list">' + (todo.length ? todo : asg.slice(0, 3)).map(a => a.html).join('') + '</div>';

  const progs = programs().filter(p => !B.assignments.some(a => a.kind === 'program' && a.id === p.id));
  if (progs.length) h += '<div class="sec">Программы обучения</div><div class="list">' + progs.map(p => {
    const pct = progPct(p);
    return '<button class="row" data-go="program" data-arg="' + esc(p.id) + '"><span class="ic">🧭</span><span class="tx"><div class="tt">' + esc(p.title) + '</div><div class="mt">' + pct + '% пройдено</div><div class="pbar"><i style="width:' + pct + '%"></i></div></span>' + chev + '</button>';
  }).join('') + '</div>';

  const cs = cards();
  const rep = cs.filter(c => prog('card', c.id) === 'повторить').length, known = cs.filter(c => prog('card', c.id) === 'знаю').length;
  h += '<div class="sec">Тренировка</div><div class="list">' +
    '<button class="row" data-go="flash"><span class="ic">🃏</span><span class="tx"><div class="tt">Карточки меню</div><div class="mt">Знаю ' + known + ' из ' + cs.length + (rep ? ' · повторить ' + rep : '') + '</div><div class="pbar"><i style="width:' + (cs.length ? Math.round(known / cs.length * 100) : 0) + '%"></i></div></span>' + chev + '</button>';
  const notPassed = B.tests.filter(t => !(t.stat && t.stat.passed)).length;
  h += '<button class="row" data-act="tab" data-tab2="tests"><span class="ic">📝</span><span class="tx"><div class="tt">Тесты</div><div class="mt">' + (notPassed ? 'Не сдано: ' + notPassed + ' из ' + B.tests.length : 'Все сданы 🎉') + '</div></span>' + chev + '</button></div>';
  return h;
};
ACT.tab = el => setTab(el.dataset.tab2);
function row(ic, title, meta, view, arg, right) {
  return '<button class="row" data-go="' + view + '" data-arg="' + esc(arg) + '"><span class="ic">' + ic + '</span><span class="tx"><div class="tt">' + esc(title) + '</div>' +
    (meta ? '<div class="mt">' + meta + '</div>' : '') + '</span>' + (right || '') + chev + '</button>';
}
function dayDiff(d) {
  const m = String(d || '').match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  const a = new Date(+m[3], +m[2] - 1, +m[1]), n = new Date(); n.setHours(0, 0, 0, 0);
  return Math.round((a - n) / 864e5);
}
function deadlineText(d, done) { if (!d) return done ? 'выполнено' : 'без срока'; return 'срок ' + d.slice(0, 5); }
function dlChip(d) {
  const n = dayDiff(d);
  if (n === null) return '';
  if (n < 0) return '<span class="chip red">Просрочено</span>';
  if (n <= 2) return '<span class="chip warn">' + (n === 0 ? 'Сегодня' : n === 1 ? 'Завтра' : '2 дня') + '</span>';
  return '';
}

// меню
VIEWS.menu = () => {
  const cs = cards();
  const cats = [...new Set(cs.map(c => c.category))];
  const als = [...new Set(cs.flatMap(c => c.allergens))].sort();
  return head('Меню', true) +
    '<input class="search" id="q" type="search" placeholder="Поиск: блюдо, ингредиент…" value="' + esc(menuF.q) + '" autocomplete="off">' +
    '<div class="chips" id="cats"><button class="fchip' + (!menuF.cat ? ' on' : '') + '" data-act="cat" data-v="">Все</button>' +
    cats.map(c => '<button class="fchip' + (menuF.cat === c ? ' on' : '') + '" data-act="cat" data-v="' + esc(c) + '">' + esc(c) + '</button>').join('') +
    '<button class="fchip' + (menuF.repeat ? ' on' : '') + '" data-act="rep">🔁 Повторить</button></div>' +
    (als.length ? '<div class="flabel">Без аллергенов:</div><div class="chips">' + als.map(a => '<button class="fchip no' + (menuF.no.includes(a) ? ' on' : '') + '" data-act="no" data-v="' + esc(a) + '">без: ' + esc(a.toLowerCase()) + '</button>').join('') + '</div>' : '') +
    '<div id="menuList"></div>';
};
AFTER.menu = () => {
  const q = document.getElementById('q');
  q.addEventListener('input', () => { menuF.q = q.value; drawMenu(); });
  drawMenu();
};
function drawMenu() {
  const words = norm(menuF.q).split(/\s+/).filter(String);
  const list = cards().filter(c => {
    if (menuF.cat && c.category !== menuF.cat) return false;
    if (menuF.no.some(a => c.allergens.includes(a))) return false;
    if (menuF.repeat && prog('card', c.id) !== 'повторить') return false;
    if (!words.length) return true;
    const hay = norm(c.title + ' ' + c.summary + ' ' + c.category + ' ' + c.tags.join(' ') + ' ' + c.html.replace(/<[^>]+>/g, ' '));
    return words.every(w => hay.includes(w));
  });
  const el = document.getElementById('menuList');
  if (!el) return;
  el.innerHTML = list.length ? '<div class="grid">' + list.map(c => {
    const st = prog('card', c.id);
    return '<button class="card" data-go="card" data-arg="' + esc(c.id) + '">' +
      '<div class="ph">' + (c.photo ? '<img src="' + esc(c.photo) + '" alt="" loading="lazy">' : '<span class="ini">' + initials(c.title) + '</span>') +
      (st ? '<span class="badge chip ' + (st === 'знаю' ? 'ok' : 'warn') + '">' + (st === 'знаю' ? '✓ Знаю' : '🔁') + '</span>' : '') + '</div>' +
      '<div class="cb"><div class="ct">' + esc(c.title) + '</div>' + (c.allergens.length ? '<div class="al">' + c.allergens.map(a => '<span>' + esc(a) + '</span>').join('') + '</div>' : '') + '</div></button>';
  }).join('') + '</div>' : '<div class="empty">Ничего не найдено' + (menuF.no.length ? ' — попробуйте снять фильтр аллергенов' : '') + '</div>';
}
ACT.cat = el => { menuF.cat = el.dataset.v; render(false); };
ACT.no = el => { const v = el.dataset.v; menuF.no = menuF.no.includes(v) ? menuF.no.filter(x => x !== v) : menuF.no.concat(v); render(false); };
ACT.rep = () => { menuF.repeat = !menuF.repeat; render(false); };

VIEWS.card = id => {
  const c = byId(id);
  if (!c) return head('Не найдено') + '<div class="empty">Карточка удалена</div>';
  const st = prog('card', c.id);
  return head('') + photo(c, 'big-ph') + '<h2 style="font:600 28px/1.15 var(--serif);margin:0">' + esc(c.title) + '</h2>' +
    (c.summary ? '<div class="lead">' + esc(c.summary) + '</div>' : '') +
    '<div class="facts">' + '<span class="chip">' + esc(c.category) + '</span>' + (c.weight ? '<span class="chip">' + esc(c.weight) + '</span>' : '') +
    (c.price ? '<span class="chip">' + esc(c.price) + ' ₽</span>' : '') + '</div>' +
    (c.allergens.length ? '<div class="sec" style="margin-top:6px">Аллергены</div><div class="al" style="margin-bottom:14px">' + c.allergens.map(a => '<span style="font-size:13px;padding:3px 9px">' + esc(a) + '</span>').join('') + '</div>' : '<div class="chip ok" style="margin-bottom:14px">Аллергенов нет</div>') +
    '<div class="prose">' + c.html + '</div>' +
    '<div class="btns"><button class="btn ghost" data-act="know" data-id="' + esc(c.id) + '" data-v="повторить">' + (st === 'повторить' ? '✓ ' : '') + '🔁 Повторить</button>' +
    '<button class="btn ' + (st === 'знаю' ? 'okb' : '') + '" data-act="know" data-id="' + esc(c.id) + '" data-v="знаю">' + (st === 'знаю' ? '✓ Знаю' : 'Знаю') + '</button></div>';
};
ACT.know = el => { haptic('light'); queueMark('card', el.dataset.id, el.dataset.v); render(false); };

// тренировка: сначала «повторить», затем новые, затем давно отмеченные «знаю»
let flashQ = [], flashOpen = false;
VIEWS.flash = () => {
  if (!flashQ.length) {
    const cs = cards();
    const w = c => { const s = prog('card', c.id); return s === 'повторить' ? 0 : !s ? 1 : 2; };
    flashQ = cs.slice().sort((a, b) => w(a) - w(b) || Math.random() - .5).map(c => c.id);
    flashOpen = false;
  }
  const c = byId(flashQ[0]);
  if (!c) return head('Карточки меню') + '<div class="empty">Пока нет карточек</div>';
  return head('Карточки меню') + '<div class="qprog">Осталось ' + flashQ.length + '<div class="pbar"><i style="width:' + Math.round((1 - flashQ.length / Math.max(1, cards().length)) * 100) + '%"></i></div></div>' +
    '<div class="flash">' + photo(c) + '<div class="fb"><div class="chip" style="margin-bottom:8px">' + esc(c.category) + '</div><h3>' + esc(c.title) + '</h3>' +
    (flashOpen ? (c.allergens.length ? '<div class="al" style="margin:8px 0 12px">' + c.allergens.map(a => '<span style="font-size:13px;padding:3px 9px">' + esc(a) + '</span>').join('') + '</div>' : '<div class="chip ok" style="margin:8px 0 12px">Аллергенов нет</div>') +
      '<div class="prose">' + c.html + '</div>' : '<div class="lead">Вспомните состав и аллергены, потом откройте карточку</div>') + '</div></div>' +
    (flashOpen ? '<div class="btns"><button class="btn ghost" data-act="fl" data-v="повторить">🔁 Повторить</button><button class="btn okb" data-act="fl" data-v="знаю">✓ Знаю</button></div>'
      : '<div class="btns"><button class="btn" data-act="flopen">Показать состав</button></div>');
};
ACT.flopen = () => { flashOpen = true; haptic('light'); render(false); };
ACT.fl = el => {
  const id = flashQ.shift();
  queueMark('card', id, el.dataset.v);
  if (el.dataset.v === 'повторить' && flashQ.length > 2) flashQ.splice(Math.min(3, flashQ.length), 0, id); // вернётся через пару карточек
  flashOpen = false;
  if (!flashQ.length) { toast('Все карточки пройдены 👏'); flashQ = []; back(); return; }
  render(true);
};

// тесты
VIEWS.tests = () => {
  if (!B.tests.length) return head('Тесты', true) + '<div class="empty">Тестов для вас пока нет</div>';
  const secs = {};
  B.tests.forEach(t => (secs[t.section] = secs[t.section] || []).push(t));
  return head('Тесты', true) + Object.keys(secs).map(s => '<div class="sec">' + esc(s) + '</div><div class="list">' + secs[s].map(t => {
    const st = t.stat;
    const chip = st && st.passed ? '<span class="chip ok">' + st.best + '%</span>' : st ? '<span class="chip red">' + st.best + '%</span>' : (t.deadline ? dlChip(t.deadline) : '') || '<span class="chip gold">+' + t.stars + ' ⭐</span>';
    return row('📝', t.title, t.count + ' ' + plural(t.count, 'вопрос', 'вопроса', 'вопросов') + (t.deadline ? ' · срок ' + t.deadline.slice(0, 5) : ''), 'test', t.id, chip);
  }).join('') + '</div>').join('');
};

VIEWS.test = id => {
  const t = B.tests.find(x => x.id === id);
  if (!t) return head('Тест') + '<div class="empty">Тест недоступен</div>';
  const st = t.stat, run = ls.get(LS.run, null);
  const resume = run && run.test === id;
  return head(t.title) + (t.desc ? '<p class="lead">' + esc(t.desc) + '</p>' : '') +
    '<div class="list" style="margin-top:8px">' +

ACT.pick = el => {
  const q = RUN.questions[RUN.i], n = Number(el.dataset.n);

// PDF: файл приходит из таблицы кусками (только после проверки входа), рисует pdf.js — работает и на Android
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' МБ' : Math.max(1, Math.round(b / 1024)) + ' КБ';
const PDF_CACHE = {};
let pdfZoom = 1;
VIEWS.pdf = id => {
  const x = (B.pdfs || []).find(p => p.id === id);
  if (!x) return head('Не найдено') + '<div class="empty">Материал удалён или недоступен</div>';

    '<button class="chip" data-act="zoom" data-z="-1" aria-label="Уменьшить">−</button><button class="chip" data-act="zoom" data-z="1" aria-label="Увеличить">+</button></div>' +
    '<div id="pdfBox" style="overflow-x:auto;margin:0 -16px;padding:0 8px;background:var(--surface-2);border-radius:12px;min-height:200px">' +
    '<div class="center" style="min-height:240px"><div class="spin"></div><p id="pdfMsg">Загружаем…</p></div></div>' +
    '<div class="btns"><button class="btn ' + (read ? 'okb' : '') + '" data-act="read" data-id="pdf:' + esc(id) + '">' + (read ? '✓ Прочитано' : 'Отметить «Прочитано»') + '</button></div>';
};
AFTER.pdf = async id => {
  const box = document.getElementById('pdfBox'), msg = document.getElementById('pdfMsg');
  try {
    await loadPdfJs();
    let data = PDF_CACHE[id];
    if (!data) {
      const chunks = [];
      let parts = 1;
      for (let i = 0; i < parts; i++) {
        const r = await api('getPdf', id, i);
        parts = r.parts;
        chunks.push(r.data);
        if (msg) msg.textContent = 'Загружаем… ' + Math.round((i + 1) / parts * 100) + '%';
      }
      const bin = chunks.map(c => atob(c)).join('');
      data = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
      PDF_CACHE[id] = data;
    }
    const doc = await pdfjsLib.getDocument({ data: data.slice() }).promise;
    if (!document.body.contains(box)) return;
    box.innerHTML = '';
    const w = Math.min(box.clientWidth - 16, 900) * pdfZoom, dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width });
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
      c.style.cssText = 'display:block;margin:8px auto;background:#fff;box-shadow:var(--shadow);width:' + Math.floor(vp.width) + 'px;height:' + Math.floor(vp.height) + 'px';
      box.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: page.getViewport({ scale: vp.scale * dpr }) }).promise;
      if (!document.body.contains(box)) return;
    }
  } catch (e) {
    if (box) box.innerHTML = '<div class="empty">Не получилось открыть файл: ' + esc(e.message) + '<br><br><button class="btn ghost" style="max-width:200px;margin:0 auto" data-act="pdfretry">Повторить</button></div>';
  }
};
ACT.zoom = el => { pdfZoom = Math.min(3, Math.max(1, pdfZoom + Number(el.dataset.z) * 0.5)); render(false); };
ACT.pdfretry = () => render(false);
let pdfJsP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return pdfJsP || (pdfJsP = new Promise((ok, fail) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(); };
    sc.onerror = () => { pdfJsP = null; fail(new Error('нет связи')); };
    document.head.appendChild(sc);
  }));
}

// ---------- мелочи интерфейса ----------
function toast(text, gold) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = 'toast' + (gold ? ' gold' : '');
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function modal(html, cb) {
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = '<div class="sheet">' + html + '</div>';
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (e.target === el || b) { el.remove(); cb(b && b.dataset.m === 'yes'); }
  });
  document.body.appendChild(el);
}
function haptic(kind) {
  try {
    if (!TG || !TG.HapticFeedback) return;
    if (kind === 'success' || kind === 'error') TG.HapticFeedback.notificationOccurred(kind); else TG.HapticFeedback.impactOccurred(kind);
  } catch (e) {}
}

async function regForm() {
  document.getElementById('tabs').hidden = true;
  $app.innerHTML = '<div class="center"><div class="spin"></div></div>';
  let info;
  try { info = await api('regInfo'); } catch (e) { return screen('Не получилось загрузить', esc(e.message)); }
  if (info.status === 'Заявка') return errorScreen('PENDING');
  if (!info.status && info.listed) { try { const r = await api('register', {}); if (r.status === 'Активен') return location.reload(); } catch (e) {} }
  const opt = (list, ph) => '<option value="">' + ph + '</option>' + list.map(x => '<option>' + esc(x) + '</option>').join('');
  $app.innerHTML = '<div class="view anim" style="padding-top:20px"><div style="color:var(--accent);width:120px">' + logo() + '</div>' +
    '<h2 style="font:600 30px/1.1 var(--serif);margin:14px 0 4px">Анкета сотрудника</h2>' +
    '<p class="lead">Администратор проверит её и откроет доступ — бот сообщит.</p>' +
    '<form id="reg" class="list" style="margin-top:10px" autocomplete="off">' +
    '<label class="flabel">Фамилия и имя</label><input class="search" name="name" placeholder="Иванова Мария" value="' + esc(info.name) + '">' +
    '<label class="flabel">Возраст</label><input class="search" name="age" inputmode="numeric" placeholder="23">' +
    '<label class="flabel">Должность</label><select class="search" name="role">' + opt(info.roles, 'Выберите должность') + '</select>' +
    '<label class="flabel">Объект</label><select class="search" name="object">' + opt(info.objects, 'Выберите объект') + '</select>' +
    '<button class="btn" style="margin-top:12px">Отправить анкету</button></form></div>';
  document.getElementById('reg').addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = ev.target, btn = f.querySelector('button');
    const form = { name: f.name.value.trim(), age: f.age.value.trim(), role: f.role.value, object: f.object.value };
    if (form.name.split(/\s+/).length < 2) return toast('Напишите фамилию и имя');
    if (!form.age) return toast('Укажите возраст');
    if (!form.role || !form.object) return toast('Выберите должность и объект');
    btn.disabled = true; btn.textContent = 'Отправляем…';
    try {
      const r = await api('register', form);
      haptic('success');
      if (r.status === 'Активен') return location.reload();
      errorScreen('PENDING');
    } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = 'Отправить анкету'; }
  });
}

async function loadContent() {
  const r = await fetch('content.json?t=' + Math.floor(Date.now() / 60000), { cache: 'no-cache' });
  if (!r.ok) throw new Error('content');
  C = await r.json();
}
async function refreshBoot() {
  try {
    B = await api('boot');
    ls.set(LS.boot, B);
    const cur = stack[stack.length - 1];
    if (cur && !['run', 'result'].includes(cur.view)) render(false);
  } catch (e) { /* остаёмся на сохранённых данных */ }
}
function errorScreen(msg) {
  if (msg === 'NOT_REGISTERED') return regForm();
  if (msg === 'PENDING') return screen('Анкета отправлена', 'Администратор скоро её проверит — бот напишет, когда доступ откроется. Обычно это занимает несколько минут.', true);
  if (msg === 'NO_ACCESS') return screen('Доступ закрыт', 'Если это ошибка — обратитесь к управляющему.', true);
  if (msg === 'NO_TELEGRAM' || msg === 'EXPIRED') return screen('Откройте через Telegram', 'Платформа работает внутри Telegram: откройте бот и нажмите кнопку «Обучение».', false);
  screen('Не получилось загрузить', esc(msg) + '<br><br><button class="btn" style="max-width:220px;margin:0 auto" onclick="location.reload()">Повторить</button>');
}
function openFromLink() {
  // ссылка из бота: ?open=test-T01 / program-<id> / card-<id> / material-<id> / checklist-<id>
  const open = new URLSearchParams(location.search).get('open') || (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || '';
  const m = open.match(/^(test|program|card|material|checklist|pdf)-(.+)$/);
  if (!m) return;
  const view = m[1] === 'checklist' ? 'material' : m[1];
  const t = { test: 'tests', program: 'materials', card: 'menu', material: 'materials', pdf: 'materials' }[view];
  tab = t;
  stack = [{ view: t, arg: null, y: 0 }, { view, arg: m[2], y: 0 }];
}

(async function start() {
  if (TG) {
    try {
      TG.ready(); TG.expand();
      TG.setHeaderColor && TG.setHeaderColor('#ffffff');
      TG.setBackgroundColor && TG.setBackgroundColor('#ffffff');
      TG.BackButton && TG.BackButton.onClick(back);
    } catch (e) {}
  }
  if (!initData) return errorScreen('NO_TELEGRAM');
  const cached = ls.get(LS.boot, null);
  const contentP = loadContent().catch(() => null);
  const bootP = api('boot').then(b => { B = b; ls.set(LS.boot, b); return b; });
  try {
    if (cached) { B = cached; await contentP; bootP.then(() => render(false)).catch(e => { if (/^[A-Z_]+$/.test(e.message)) errorScreen(e.message); }); }
    else { await Promise.all([contentP, bootP]); }
  } catch (e) { return errorScreen(e.message); }
  document.getElementById('tabs').hidden = false;
  stack = [{ view: 'home', arg: null, y: 0 }];
  openFromLink();
  render(true);
  flush();
})();
</script>
</body>
