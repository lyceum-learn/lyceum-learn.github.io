# Сборка сайта при каждом изменении: content/*.md → content.json → GitHub Pages.
# Включить один раз: Settings → Pages → Source: GitHub Actions.
name: Сборка платформы
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать материалы
        run: python3 build_content.py
      - name: Подготовить сайт
        run: mkdir _site && cp -r index.html config.js content.json content-meta.json content _site/ && find _site/content -name '*.md' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
